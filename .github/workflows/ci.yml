name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontEnd
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:baseline
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r ai/requirements.txt
      - run: pip install pytest
      - run: python scripts/audit_env_contract.py
      - run: python docs/contracts/fixtures/internal-ai-v1/validate_fixtures.py
      - run: python -m pytest ai/tests

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
      - run: chmod +x backend/gradlew
      - run: backend/gradlew -p backend test postgresTest --no-daemon --console=plain
