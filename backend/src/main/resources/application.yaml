server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  environment: ${APP_ENVIRONMENT:LOCAL}
  security:
    jwt:
      issuer: ${JWT_ISSUER:aivle-business-validation}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      secret: ${JWT_SECRET:}
      clock-skew: ${JWT_CLOCK_SKEW:30s}
  ai:
    enabled: false
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:60s}
    max-retries: ${AI_MAX_RETRIES:2}
    max-input-characters: ${AI_MAX_INPUT_CHARACTERS:200000}
    max-response-bytes: ${AI_MAX_RESPONSE_BYTES:1048576}
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:30s}
    internal-api-key: ${AI_SERVER_INTERNAL_API_KEY:}
  jobs:
    document-processing:
      enabled: ${DOCUMENT_JOB_RUNNER_ENABLED:false}
      poll-interval: ${DOCUMENT_JOB_POLL_INTERVAL:5s}
      recovery-interval: ${DOCUMENT_JOB_RECOVERY_INTERVAL:30s}
      batch-size: ${DOCUMENT_JOB_BATCH_SIZE:5}
      max-attempts: ${DOCUMENT_JOB_MAX_ATTEMPTS:3}
      execution-timeout: ${DOCUMENT_JOB_EXECUTION_TIMEOUT:2m}
      retry-initial-delay: ${DOCUMENT_JOB_RETRY_INITIAL_DELAY:5s}
      retry-max-delay: ${DOCUMENT_JOB_RETRY_MAX_DELAY:60s}
      stale-running-timeout: ${DOCUMENT_JOB_STALE_TIMEOUT:5m}
      worker-id: ${DOCUMENT_JOB_WORKER_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  file-storage:
    root: ${FILE_STORAGE_ROOT:./data/files}
    business-plan-max-size: 20MB
    image-max-size: 10MB
    business-plan-extensions: docx
    image-extensions: png,jpg,jpeg,webp
  object-storage:
    provider: ${OBJECT_STORAGE_PROVIDER:local}
    local-root: ${OBJECT_STORAGE_LOCAL_ROOT:./data/objects}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:aivle-ai-artifacts}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
    connect-timeout: ${OBJECT_STORAGE_CONNECT_TIMEOUT:3s}
    read-timeout: ${OBJECT_STORAGE_READ_TIMEOUT:30s}
    presigned-get-expiry: ${OBJECT_STORAGE_PRESIGNED_GET_EXPIRY:5m}
    presigned-put-expiry: ${OBJECT_STORAGE_PRESIGNED_PUT_EXPIRY:5m}
    artifact-max-size: ${OBJECT_STORAGE_ARTIFACT_MAX_SIZE:1MB}
    allowed-content-types:
      - application/json
      - image/png
      - image/jpeg
      - image/webp
  storage:
    reconciliation:
      enabled: ${STORAGE_RECONCILIATION_ENABLED:false}
      dry-run: ${STORAGE_RECONCILIATION_DRY_RUN:true}
      minimum-age: ${STORAGE_RECONCILIATION_MINIMUM_AGE:1h}
      quarantine-retention: ${STORAGE_RECONCILIATION_QUARANTINE_RETENTION:7d}
      batch-size: ${STORAGE_RECONCILIATION_BATCH_SIZE:100}
      schedule: ${STORAGE_RECONCILIATION_SCHEDULE:0 0 3 * * *}
  document:
    parser:
      docx:
        max-file-size: 20MB
        max-uncompressed-size: 100MB
        max-archive-entries: 10000
        min-inflate-ratio: 0.01
        max-characters: 2000000
        max-blocks: 10000
        max-table-cells: 20000
        max-paragraph-characters: 50000
  journey:
    concept:
      target-count: ${CONCEPT_TARGET_ELIGIBLE_COUNT:3}
      max-replacement-rounds: ${CONCEPT_MAX_REPLACEMENT_ROUNDS:2}
      max-inspected-candidates: ${CONCEPT_MAX_INSPECTED_CANDIDATES:9}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
