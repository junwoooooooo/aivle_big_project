name: aivle-big-project

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aivle}
      POSTGRES_USER: ${POSTGRES_USER:-aivle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aivle-e2e}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aivle-e2e}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:-aivle-ai-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"
    networks:
      - app-network

  ai-server:
    build:
      context: ./ai
    environment:
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required}
      MARKETING_COPY_MODEL: ${MARKETING_COPY_MODEL:-gpt-4o-mini}
      MARKETING_IMAGE_MODEL: ${MARKETING_IMAGE_MODEL:-gpt-image-2}
      AI_IMAGE_MODEL: ${MARKETING_IMAGE_MODEL:-gpt-image-2}
      AI_MODEL_CONCEPT_VALIDATION: ${AI_MODEL_CONCEPT_VALIDATION:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      AI_FIXTURE_MODE: ${AI_FIXTURE_MODE:-false}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      AI_CONCEPT_GENERATION_CONCURRENCY: ${AI_CONCEPT_GENERATION_CONCURRENCY:-1}
      AI_CONCEPT_TEST_FAILURE_INJECTION: ${AI_CONCEPT_TEST_FAILURE_INJECTION:-false}
      AI_CONCEPT_TEST_FAILURE_PLAN: ${AI_CONCEPT_TEST_FAILURE_PLAN:-}
      MOLEG_API_KEY: ${MOLEG_API_KEY:-}
      MOLEG_API_BASE_URL: ${MOLEG_API_BASE_URL:-https://www.law.go.kr/DRF}
      LEGAL_REGISTRY_VERSION: ${LEGAL_REGISTRY_VERSION:-legal-registry-v1}
      LEGAL_PROVIDER_TIMEOUT_SECONDS: ${LEGAL_PROVIDER_TIMEOUT_SECONDS:-30}
      LEGAL_SOURCE_CACHE_SECONDS: ${LEGAL_SOURCE_CACHE_SECONDS:-3600}
      AI_ARTIFACT_ALLOWED_ORIGINS: http://minio:9000
      AI_ARTIFACT_HTTP_TIMEOUT_SECONDS: ${AI_ARTIFACT_HTTP_TIMEOUT_SECONDS:-10}
      AI_ARTIFACT_MAX_BYTES: ${AI_ARTIFACT_MAX_BYTES:-1048576}
      APP_ENVIRONMENT: ${AI_APP_ENVIRONMENT:-LOCAL}
      AI_E2E_FAULTS_ENABLED: ${AI_E2E_FAULTS_ENABLED:-false}
      AI_E2E_FAULT_MODE: ${AI_E2E_FAULT_MODE:-}
      AI_E2E_FAULT_DELAY_SECONDS: ${AI_E2E_FAULT_DELAY_SECONDS:-5}
      OPENAI_API_KEY: ${MARKET_RESEARCH_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${AI_BASE_URL:-}}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TECH_OPS_ENABLE_DART_CORP_LOOKUP: ${TECH_OPS_ENABLE_DART_CORP_LOOKUP:-false}
      TECH_OPS_ADVISOR_MODEL: ${TECH_OPS_ADVISOR_MODEL:-}
      BM_MODEL: ${BM_MODEL:-${AI_MODEL}}
      TWIN_BANK_DIR: /app/app/twin/bank
      TWIN_CONCURRENCY: ${TWIN_CONCURRENCY:-32}
    volumes:
      - ./ai/app/research/research2/runs:/app/app/research/research2/runs:ro
      - type: bind
        source: ${TWIN_BANK_HOST_DIR}
        target: /app/app/twin/bank
        read_only: true
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aivle}
      DB_USERNAME: ${POSTGRES_USER:-aivle}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-LOCAL}
      AI_SERVER_BASE_URL: http://ai-server:8000
      AI_SERVER_INTERNAL_API_KEY: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}
      MARKET_MODULE_INTERNAL_API_KEY: ${MARKET_MODULE_INTERNAL_API_KEY:-}
      AI_SERVER_CONNECT_TIMEOUT: ${AI_SERVER_CONNECT_TIMEOUT:-3s}
      AI_SERVER_READ_TIMEOUT: ${AI_SERVER_READ_TIMEOUT:-30s}
      AI_SERVER_LONG_READ_TIMEOUT: ${AI_SERVER_LONG_READ_TIMEOUT:-7m}
      AI_SERVER_MARKET_RESEARCH_READ_TIMEOUT: ${AI_SERVER_MARKET_RESEARCH_READ_TIMEOUT:-22m}
      AI_SERVER_CONCEPT_PORTFOLIO_READ_TIMEOUT: ${AI_SERVER_CONCEPT_PORTFOLIO_READ_TIMEOUT:-15m}
      AI_SERVER_TWIN_SURVEY_READ_TIMEOUT: ${AI_SERVER_TWIN_SURVEY_READ_TIMEOUT:-14m}
      APP_LEGAL_REGISTRY_VERSION: ${LEGAL_REGISTRY_VERSION:-legal-registry-v1}
      APP_E2E_DEFER_ARTIFACT_WAKE: ${APP_E2E_DEFER_ARTIFACT_WAKE:-false}
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aivle-ai-artifacts}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-aivle-e2e}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontEnd/Dockerfile
      args:
        VITE_ENABLE_PIPELINE_DEBUG: ${VITE_ENABLE_PIPELINE_DEBUG:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
