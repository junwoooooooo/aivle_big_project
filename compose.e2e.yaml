services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  ai-server:
    environment:
      APP_ENVIRONMENT: E2E
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: postgres,dev-header-auth,e2e
      APP_ENVIRONMENT: E2E
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
