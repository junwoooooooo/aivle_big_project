name: aivle-big-project-prod

services:
  ai-server:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    restart: unless-stopped

    environment:
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required}

      FINAL_BUSINESS_PROPOSAL_MODEL: ${FINAL_BUSINESS_PROPOSAL_MODEL:-gpt-4.1-mini}

      MARKET_INTERVIEW_MODEL: ${MARKET_INTERVIEW_MODEL:-}
      MARKET_INTERVIEW_TEMPERATURE: ${MARKET_INTERVIEW_TEMPERATURE:-1.0}
      MARKET_INTERVIEW_REASONING_EFFORT: ${MARKET_INTERVIEW_REASONING_EFFORT:-}
      MARKET_INTERVIEW_CONCURRENCY: ${MARKET_INTERVIEW_CONCURRENCY:-4}

      MARKETING_COPY_MODEL: ${MARKETING_COPY_MODEL:-gpt-4o-mini}
      MARKETING_IMAGE_MODEL: ${MARKETING_IMAGE_MODEL:-gpt-image-2}
      AI_IMAGE_MODEL: ${MARKETING_IMAGE_MODEL:-gpt-image-2}

      AI_MODEL_CONCEPT_VALIDATION: ${AI_MODEL_CONCEPT_VALIDATION:-}
      AI_BASE_URL: ${AI_BASE_URL:-}

      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}

      BACKEND_INTERNAL_BASE_URL: http://backend:8080

      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      AI_CONCEPT_GENERATION_CONCURRENCY: ${AI_CONCEPT_GENERATION_CONCURRENCY:-1}

      AI_FIXTURE_MODE: "false"
      AI_CONCEPT_TEST_FAILURE_INJECTION: "false"
      AI_E2E_FAULTS_ENABLED: "false"

      MOLEG_API_KEY: ${MOLEG_API_KEY:-}
      MOLEG_API_BASE_URL: ${MOLEG_API_BASE_URL:-https://www.law.go.kr/DRF}
      LEGAL_REGISTRY_VERSION: ${LEGAL_REGISTRY_VERSION:-legal-registry-v1}
      LEGAL_PROVIDER_TIMEOUT_SECONDS: ${LEGAL_PROVIDER_TIMEOUT_SECONDS:-30}
      LEGAL_SOURCE_CACHE_SECONDS: ${LEGAL_SOURCE_CACHE_SECONDS:-3600}

      OPENAI_API_KEY: ${MARKET_RESEARCH_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${AI_BASE_URL:-}}

      MARKET_SEARCH_MODEL: ${MARKET_SEARCH_MODEL:-gpt-5.4-nano}
      MARKET_EXTRACT_MODEL: ${MARKET_EXTRACT_MODEL:-gpt-5.6-luna}
      MARKET_DESIGN_MODEL: ${MARKET_DESIGN_MODEL:-gpt-5.6-luna}

      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      TECH_OPS_ENABLE_DART_CORP_LOOKUP: ${TECH_OPS_ENABLE_DART_CORP_LOOKUP:-false}
      TECH_OPS_ADVISOR_MODEL: ${TECH_OPS_ADVISOR_MODEL:-}

      BM_MODEL: ${BM_MODEL:-${AI_MODEL}}
      BM_REASONING_EFFORT: ${BM_REASONING_EFFORT:-}

      TWIN_BANK_DIR: /app/app/twin/bank
      TWIN_CONCURRENCY: ${TWIN_CONCURRENCY:-32}

      AI_ARTIFACT_ALLOWED_ORIGINS: ${AI_ARTIFACT_ALLOWED_ORIGINS:-https://s3.us-east-1.amazonaws.com}
      AI_ARTIFACT_HTTP_TIMEOUT_SECONDS: ${AI_ARTIFACT_HTTP_TIMEOUT_SECONDS:-10}
      AI_ARTIFACT_MAX_BYTES: ${AI_ARTIFACT_MAX_BYTES:-1048576}

      APP_ENVIRONMENT: PRODUCTION

    volumes:
      - type: bind
        source: ${TWIN_BANK_HOST_DIR:?TWIN_BANK_HOST_DIR is required}
        target: /app/app/twin/bank
        read_only: true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

    networks:
      - app-network


  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: postgres

      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      APP_ENVIRONMENT: PRODUCTION

      AI_SERVER_BASE_URL: http://ai-server:8000
      AI_SERVER_INTERNAL_API_KEY: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}

      AI_SERVER_CONNECT_TIMEOUT: ${AI_SERVER_CONNECT_TIMEOUT:-3s}
      AI_SERVER_READ_TIMEOUT: ${AI_SERVER_READ_TIMEOUT:-30s}
      AI_SERVER_LONG_READ_TIMEOUT: ${AI_SERVER_LONG_READ_TIMEOUT:-7m}
      AI_SERVER_MARKET_RESEARCH_READ_TIMEOUT: ${AI_SERVER_MARKET_RESEARCH_READ_TIMEOUT:-63m}
      AI_SERVER_CONCEPT_PORTFOLIO_READ_TIMEOUT: ${AI_SERVER_CONCEPT_PORTFOLIO_READ_TIMEOUT:-15m}
      AI_SERVER_TWIN_SURVEY_READ_TIMEOUT: ${AI_SERVER_TWIN_SURVEY_READ_TIMEOUT:-14m}

      APP_LEGAL_REGISTRY_VERSION: ${LEGAL_REGISTRY_VERSION:-legal-registry-v1}

      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-https://s3.us-east-1.amazonaws.com}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-https://s3.us-east-1.amazonaws.com}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}

      # AWS에서는 둘 다 비운다.
      # 방금 수정한 DefaultCredentialsProvider가 EC2 IAM Role을 사용한다.
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}

      OBJECT_STORAGE_PATH_STYLE_ACCESS: "false"
      OBJECT_STORAGE_CONNECT_TIMEOUT: ${OBJECT_STORAGE_CONNECT_TIMEOUT:-3s}
      OBJECT_STORAGE_READ_TIMEOUT: ${OBJECT_STORAGE_READ_TIMEOUT:-30s}
      OBJECT_STORAGE_PRESIGNED_GET_EXPIRY: ${OBJECT_STORAGE_PRESIGNED_GET_EXPIRY:-5m}
      OBJECT_STORAGE_PRESIGNED_PUT_EXPIRY: ${OBJECT_STORAGE_PRESIGNED_PUT_EXPIRY:-5m}
      OBJECT_STORAGE_ARTIFACT_MAX_SIZE: ${OBJECT_STORAGE_ARTIFACT_MAX_SIZE:-32MB}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}

      BOOTSTRAP_ADMIN_ENABLED: "false"
      REVIEW_QUICK_ACCESS_ENABLED: "false"
      APP_E2E_DEFER_ARTIFACT_WAKE: "false"

      JOB_EVENT_HEARTBEAT_MS: ${JOB_EVENT_HEARTBEAT_MS:-15000}
      JOB_EVENT_STREAM_TIMEOUT_MS: ${JOB_EVENT_STREAM_TIMEOUT_MS:-4200000}

      PROJECT_EVENT_HEARTBEAT_MS: ${PROJECT_EVENT_HEARTBEAT_MS:-15000}
      PROJECT_EVENT_STREAM_TIMEOUT_MS: ${PROJECT_EVENT_STREAM_TIMEOUT_MS:-4200000}

    depends_on:
      ai-server:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

    networks:
      - app-network


  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-80}:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

    networks:
      - app-network


networks:
  app-network:
    driver: bridge