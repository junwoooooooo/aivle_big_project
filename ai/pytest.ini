[pytest]
addopts = -p no:cacheprovider
# ⚠ `tests` 로 좁힌다. 판 ㉝ 이 research2 를 `app/research/research2/` 안으로 옮기면서
#   `python -m pytest -q` 가 그쪽 `tests/*.py` 까지 줍게 됐다. 그것들은 pytest 테스트가
#   아니라 **스크립트**다(끝에서 `sys.exit`) — 수집 단계에서 INTERNALERROR 로 죽는다.
#   research2 테스트는 설계상 **파일별로** 돌린다: `python tests/test_step1.py`.
testpaths = tests
norecursedirs = app/research/research2 .git __pycache__
