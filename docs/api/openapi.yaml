        - riskLevel
        - title
        - finding
        - rationale
        - recommendedAction
        - requiresProfessionalReview
      properties:
        id: {type: integer, format: int64}
        category:
          type: string
          enum: [BUSINESS_REGISTRATION, LICENSE_AND_PERMIT, PRIVACY_AND_DATA, TERMS_AND_CONTRACT, INTELLECTUAL_PROPERTY, CONSUMER_PROTECTION, ADVERTISING_AND_MARKETING, LABOR_AND_EMPLOYMENT, INDUSTRY_SPECIFIC, TAX_AND_FINANCIAL]
        displayOrder: {type: integer, minimum: 1}
        applicability:
          type: string
          enum: [APPLICABLE, POSSIBLY_APPLICABLE, NOT_APPLICABLE, INSUFFICIENT_INFORMATION]
        riskLevel: {$ref: '#/components/schemas/LegalRiskLevel'}
        title: {type: string}
        finding: {type: string}
        rationale: {type: string}
        recommendedAction: {type: string}
        evidenceJson: {type: string, description: JSON array encoded as TEXT}
        sourceSectionCodesJson: {type: string, description: JSON array encoded as TEXT}
        requiresProfessionalReview: {type: boolean}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
    LegalReviewQuestion:
      type: object
      required: [id, displayOrder, question, status]
      properties:
        id: {type: integer, format: int64}
        displayOrder: {type: integer, minimum: 1}
        question: {type: string}
        reason: {type: [string, 'null']}
        status: {type: string, enum: [OPEN, ANSWERED, WAIVED]}
    LegalRiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN]
    FeasibilityStartApiResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, const: true}
        data:
          type: object
          required:
            [projectId, jobId, status, structuredPlanId, legalReviewId,
             sourceDocumentVersionId]
          properties:
            projectId: {type: integer, format: int64}
            assessmentId: {type: [integer, 'null'], format: int64}
            jobId: {type: integer, format: int64}
            status: {$ref: '#/components/schemas/JobStatus'}
            structuredPlanId: {type: integer, format: int64}
            legalReviewId: {type: integer, format: int64}
            sourceDocumentVersionId: {type: integer, format: int64}
        meta: {$ref: '#/components/schemas/Meta'}
    FeasibilityAssessmentApiResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/FeasibilityAssessment'}
        meta: {$ref: '#/components/schemas/Meta'}
    FeasibilityAssessment:
      type: object
      required:
        [assessmentId, projectId, structuredPlanId, legalReviewId,
         sourceDocumentVersionId, versionNumber, status, verdict, confidence,
         summary, keyStrengthsJson, keyRisksJson, disclaimer, provider,
         modelName, promptVersion, catalogVersion, completedAt, dimensions,
         validationTasks]
      properties:
        assessmentId: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        structuredPlanId: {type: integer, format: int64}
        legalReviewId: {type: integer, format: int64}
        sourceDocumentVersionId: {type: integer, format: int64}
        versionNumber: {type: integer, minimum: 1}
        status:
          type: string
          enum: [NEEDS_VALIDATION, COMPLETED]
        verdict:
          type: string
          description: A pre-assessment verdict, never a success probability.
          enum: [PROMISING, CONDITIONAL, HIGH_RISK, INSUFFICIENT_INFORMATION]
        overallScore:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: >
            Weighted rule result. Null when any required dimension lacks enough
            information; unknown information is never converted to zero.
        confidence: {$ref: '#/components/schemas/FeasibilityConfidence'}
        summary: {type: string}
        keyStrengthsJson: {type: string, description: JSON string array stored as TEXT}
        keyRisksJson: {type: string, description: JSON string array stored as TEXT}
        disclaimer: {type: string}
        provider:
          type: string
          description: mock identifies the deterministic local/test adapter.
        modelName: {type: string}
        promptVersion: {type: string, const: feasibility-analysis-v1}
        catalogVersion: {type: string, const: feasibility-catalog-v1}
        completedAt: {type: string, format: date-time}
        dimensions:
          type: array
          minItems: 10
          maxItems: 10
          items: {$ref: '#/components/schemas/FeasibilityDimensionResult'}
        validationTasks:
          type: array
          items: {$ref: '#/components/schemas/FeasibilityValidationTask'}
    FeasibilityDimensionCode:
      type: string
      enum:
        - PROBLEM_AND_NEED
        - TARGET_CUSTOMER
        - MARKET_ATTRACTIVENESS
        - COMPETITIVE_POSITION
        - PRODUCT_SOLUTION_FIT
        - BUSINESS_MODEL
        - GO_TO_MARKET
        - FINANCIAL_VIABILITY
        - EXECUTION_CAPABILITY
        - LEGAL_AND_REGULATORY
    FeasibilityConfidence:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    FeasibilityDimensionResult:
      type: object
      required:
        [id, code, displayOrder, confidence, status, finding, rationale,
         strengthsJson, risksJson, assumptionsJson, evidenceJson,
         sourceSectionCodesJson, legalFindingIdsJson, recommendedActionsJson]
      properties:
        id: {type: integer, format: int64}
        code: {$ref: '#/components/schemas/FeasibilityDimensionCode'}
        displayOrder: {type: integer, minimum: 1, maximum: 10}
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        confidence: {$ref: '#/components/schemas/FeasibilityConfidence'}
        status:
          type: string
          enum: [ASSESSED, NEEDS_VALIDATION, INSUFFICIENT_INFORMATION]
        finding: {type: string}
        rationale: {type: string}
        strengthsJson: {type: string, description: JSON string array stored as TEXT}
        risksJson: {type: string, description: JSON string array stored as TEXT}
        assumptionsJson: {type: string, description: JSON string array stored as TEXT}
        evidenceJson:
          type: string
          description: >
            JSON array of typed evidence. Allowed types are DOCUMENT_FACT,
            USER_ASSUMPTION, AI_INFERENCE, LEGAL_REVIEW, and
            EXTERNAL_VERIFICATION_REQUIRED.
        sourceSectionCodesJson: {type: string, description: JSON string array stored as TEXT}
        legalFindingIdsJson: {type: string, description: JSON integer array stored as TEXT}
        recommendedActionsJson: {type: string, description: JSON string array stored as TEXT}
    FeasibilityValidationTask:
      type: object
      required:
