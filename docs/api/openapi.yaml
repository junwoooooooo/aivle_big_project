        - structuredPlanId
        - sourceDocumentVersionId
        - status
        - overallRiskLevel
        - summary
        - disclaimer
        - promptVersion
        - findings
        - questions
      properties:
        legalReviewId: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        structuredPlanId: {type: integer, format: int64}
        sourceDocumentVersionId: {type: integer, format: int64}
        versionNumber: {type: integer}
        status: {type: string, enum: [NEEDS_REVIEW, COMPLETED]}
