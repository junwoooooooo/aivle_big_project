openapi: 3.1.0
info:
  title: AI Business Validation Platform Document API
  version: 0.12.0-phase3-taskrun
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Canonical authentication, document upload, asynchronous processing,
    structured-plan mutation, and explicit confirmation contract.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Stateless signup, login, refresh rotation, and logout
  - name: Users
    description: Current authenticated user
  - name: Projects
    description: Current-user-owned business validation projects
  - name: Documents
    description: Project-owned source documents and immutable versions
  - name: Structured Plans
    description: Extracted business-plan structure, missing fields, and confirmation
  - name: Jobs
    description: Asynchronous processing job state
  - name: Legal Reviews
    description: AI-assisted legal and regulatory pre-review, never legal advice
  - name: Feasibility Assessments
    description: Evidence-aware business feasibility pre-assessment and validation tasks
  - name: Personas
    description: Aggregate baseline persona catalog, recommendations, and customer-validation plans
security:
  - platformAuth: []
paths:
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Register an active user and issue an access/refresh pair
      operationId: signup
      x-implementation-phase: Phase 3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignupRequest'}
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthApiResponse'}
        '400': {$ref: '#/components/responses/StandardError'}
        '409': {$ref: '#/components/responses/StandardError'}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with normalized email and password
      operationId: login
      x-implementation-phase: Phase 3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthApiResponse'}
        '400': {$ref: '#/components/responses/StandardError'}
        '401': {$ref: '#/components/responses/StandardError'}
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a valid refresh token and issue a new pair
      operationId: refreshAccessToken
      x-implementation-phase: Phase 3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Token pair rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPairApiResponse'}
        '400': {$ref: '#/components/responses/StandardError'}
        '401': {$ref: '#/components/responses/StandardError'}
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the supplied current refresh token
      operationId: logout
      x-implementation-phase: Phase 3
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Refresh token revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyApiResponse'}
        '400': {$ref: '#/components/responses/StandardError'}
        '401': {$ref: '#/components/responses/StandardError'}
  /users/me:
    get:
      tags: [Users]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      x-implementation-phase: Phase 3
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserApiResponse'}
        '401': {$ref: '#/components/responses/StandardError'}
  /projects:
    get:
      tags: [Projects]
      summary: List the current user's active projects
      operationId: listProjects
      x-implementation-phase: Phase 5
      responses:
        '200':
          description: Projects ordered by most recently updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectListApiResponse'}
        '401': {$ref: '#/components/responses/StandardError'}
    post:
      tags: [Projects]
      summary: Create a business validation project
      operationId: createProject
      x-implementation-phase: Phase 5
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectDetailApiResponse'}
        '400': {$ref: '#/components/responses/StandardError'}
        '401': {$ref: '#/components/responses/StandardError'}
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get a project owned by the current user
      operationId: getProject
      x-implementation-phase: Phase 5
      responses:
        '200':
          description: Owned project detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectDetailApiResponse'}
        '401': {$ref: '#/components/responses/StandardError'}
        '404':
          description: Project does not exist or is not visible to the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Documents]
      summary: Upload a business plan and queue document processing
      operationId: uploadProjectDocument
      x-implementation-phase: Phase 1C
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: DOCX only, maximum 20 MiB
                documentType:
                  type: string
                  enum: [BUSINESS_PLAN]
                  default: BUSINESS_PLAN
      responses:
        '202':
          description: Upload stored and processing queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadApiResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '413':
          $ref: '#/components/responses/StandardError'
        '415':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    get:
      tags: [Documents]
      summary: List project documents
      operationId: listProjectDocuments
      x-implementation-phase: Phase 1B
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListApiResponse'
        '404':
          $ref: '#/components/responses/StandardError'
  /documents/{documentId}/versions/{versionId}:
    get:
      tags: [Documents]
      summary: Get one document version
      operationId: getDocumentVersion
      x-implementation-phase: Phase 1B
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Document version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionApiResponse'
        '404':
          $ref: '#/components/responses/StandardError'
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Get asynchronous job state
      operationId: getJob
      x-implementation-phase: Phase 1B
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state. PARTIAL means processing completed but required business-plan sections need user input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApiResponse'
        '404':
          $ref: '#/components/responses/StandardError'
  /projects/{projectId}/jobs/latest:
    get:
      tags: [Jobs]
      summary: Get the latest project job of one type
      description: >
        Returns the most recently created visible job, whether active or
        terminal. The caller distinguishes recovery behavior by status.
      operationId: getLatestProjectJob
      x-implementation-phase: Phase 6
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: jobType
          in: query
          required: false
          schema:
            type: string
            enum: [DOCUMENT_PARSE, LEGAL_REVIEW, FEASIBILITY_ANALYSIS]
            default: DOCUMENT_PARSE
      responses:
        '200':
          description: Latest owner-visible job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApiResponse'
        '404':
          description: Project/job does not exist or is not visible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /projects/{projectId}/structured-plans/latest:
    get:
      tags: [Structured Plans]
      summary: Get latest structured business plan
      operationId: getLatestStructuredPlan
      x-implementation-phase: Phase 1C
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Latest structured plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPlanApiResponse'
        '404':
          $ref: '#/components/responses/StandardError'
  /projects/{projectId}/structured-plans/{planId}/missing-fields/{fieldId}:
    patch:
      tags: [Structured Plans]
      summary: Supply or waive a missing field
      description: >
        Stores user-provided completion data separately from the AI section
        status. A successful response contains the updated field lock version;
        clients refetch the latest structured plan to obtain server-recalculated
        completion, status, missing fields, and the latest plan lock version.
      operationId: updateMissingField
      x-implementation-phase: Phase 3
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/FieldId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissingFieldRequest'
      responses:
        '200':
          description: Updated missing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingFieldApiResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          description: >
            RESOURCE_VERSION_CONFLICT when the supplied field lock version is
            stale, or PLAN_NOT_EDITABLE when the plan is already confirmed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '422':
          $ref: '#/components/responses/StandardError'
  /projects/{projectId}/structured-plans/{planId}/confirm:
    post:
      tags: [Structured Plans]
      summary: Confirm structured plan for downstream analysis
      description: >
        Confirms only a DRAFT plan with server completion 100 and no OPEN
        required missing field. Success returns that confirmed plan and advances
        the project stage from STRUCTURING to LEGAL_REVIEW; it does not start a
        legal-analysis job.
      operationId: confirmStructuredPlan
      x-implementation-phase: Phase 3
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmStructuredPlanRequest'
      responses:
        '200':
          description: Confirmed structured plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPlanApiResponse'
        '409':
          description: >
            RESOURCE_VERSION_CONFLICT for a stale plan lock version. A stale
            duplicate confirmation must refetch the latest plan before the
            client decides whether confirmation already succeeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
  /projects/{projectId}/legal-reviews:
    post:
      tags: [Legal Reviews]
      summary: Start a legal and regulatory pre-review
      description: >
        Creates one asynchronous LEGAL_REVIEW job for the latest complete,
        CONFIRMED structured plan. The immutable plan snapshot is the only
        analysis input. This operation does not provide legal advice.
      operationId: startLegalReview
      x-implementation-phase: Phase 8
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: Job accepted, or the completed idempotent result returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalReviewStartApiResponse'}
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          description: A legal review job is already QUEUED or RUNNING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '422':
          description: Project stage or confirmed-plan input is invalid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /projects/{projectId}/legal-reviews/latest:
    get:
      tags: [Legal Reviews]
      summary: Get the latest legal and regulatory pre-review
      operationId: getLatestLegalReview
      x-implementation-phase: Phase 8
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Latest owner-visible structured pre-review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalReviewApiResponse'}
        '404':
          $ref: '#/components/responses/StandardError'
  /projects/{projectId}/feasibility-assessments:
    post:
      tags: [Feasibility Assessments]
      summary: Start an evidence-aware business feasibility pre-assessment
      description: >
        Creates one asynchronous FEASIBILITY_ANALYSIS job for the latest complete,
        CONFIRMED structured plan and its latest persisted legal review. The result
        is not a success probability, investment recommendation, market study, or
        financial forecast. Missing information remains unknown rather than zero.
      operationId: startFeasibilityAssessment
      x-implementation-phase: Phase 9
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: Job accepted, or the completed idempotent result returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeasibilityStartApiResponse'}
        '404': {$ref: '#/components/responses/StandardError'}
        '409':
          description: An assessment job is already QUEUED or RUNNING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '422':
          description: Project stage, confirmed plan, or legal-review input is invalid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /projects/{projectId}/feasibility-assessments/latest:
    get:
      tags: [Feasibility Assessments]
      summary: Get the latest persisted feasibility assessment
      operationId: getLatestFeasibilityAssessment
      x-implementation-phase: Phase 9
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Latest owner-visible assessment, dimensions, and validation tasks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeasibilityAssessmentApiResponse'}
        '404': {$ref: '#/components/responses/StandardError'}
  /personas/catalog:
    get:
      tags: [Personas]
      summary: List the aggregate baseline persona catalog
      operationId: listBaselinePersonas
      x-implementation-phase: Phase 10
      responses:
        '200':
          description: The 56-row aggregate catalog; no individual survey rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaselinePersonaListApiResponse'}
        '401': {$ref: '#/components/responses/StandardError'}
  /projects/{projectId}/persona-recommendations:
    post:
      tags: [Personas]
      summary: Start a persona recommendation and customer-validation planning job
      description: >
        Compares the latest complete confirmed plan and its persisted feasibility
        assessment with the aggregate catalog. The result is a hypothesis, not
        observed customer evidence, purchase probability, or completed validation.
      operationId: startPersonaRecommendation
      x-implementation-phase: Phase 10
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: Job accepted, or the completed idempotent result returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonaStartApiResponse'}
        '404': {$ref: '#/components/responses/StandardError'}
        '409': {$ref: '#/components/responses/StandardError'}
        '422': {$ref: '#/components/responses/StandardError'}
  /projects/{projectId}/persona-recommendations/latest:
    get:
      tags: [Personas]
      summary: Get the latest persona recommendation and validation plan
      operationId: getLatestPersonaRecommendation
      x-implementation-phase: Phase 10
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Latest owner-visible recommendation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonaRecommendationApiResponse'}
        '404': {$ref: '#/components/responses/StandardError'}
  /projects/{projectId}/financial-analysis/source:
    get:
      tags: [Financial Analyses]
      summary: Confirmed feasibility and structured-plan source for a financial analysis
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': {description: Financial source snapshot metadata}
  /projects/{projectId}/financial-analyses:
    get:
      tags: [Financial Analyses]
      summary: List non-deleted project financial analyses
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': {description: Financial analysis summaries}
    post:
      tags: [Financial Analyses]
      summary: Create a financial-analysis draft from confirmed assumptions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '201': {description: Financial analysis draft}
  /projects/{projectId}/financial-analyses/{analysisId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Financial Analyses]
      summary: Get a financial analysis and its immutable source snapshot
      responses:
        '200': {description: Financial analysis detail}
    patch:
      tags: [Financial Analyses]
      summary: Update a draft financial analysis
      responses:
        '200': {description: Updated financial analysis}
    delete:
      tags: [Financial Analyses]
      summary: Soft-delete a financial analysis
      responses:
        '204': {description: Deleted}
  /projects/{projectId}/financial-analyses/{analysisId}/run:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [Financial Analyses]
      summary: Deterministically calculate and complete a financial analysis
      responses:
        '200': {description: Completed financial analysis}
  /projects/{projectId}/financial-analyses/{analysisId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [Financial Analyses]
      summary: Duplicate assumptions into a new financial-analysis draft
      responses:
        '201': {description: New financial analysis draft}
  /api/v2/projects/{projectId}/task-runs/{taskRunId}:
    get:
      tags: [Jobs]
      servers:
        - url: /
      summary: Read an owner-scoped Target TaskRun
      operationId: getTaskRunV2
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/TaskRunId'}
      responses:
        '200':
          description: Current state, including terminal failure states
          headers:
            X-Correlation-Id:
              description: Request correlation identifier
              schema: {type: string, maxLength: 128}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRunV2Response'}
        '404': {$ref: '#/components/responses/TaskRunV2Error'}
  /api/v2/projects/{projectId}/task-runs/{taskRunId}/retry:
    post:
      tags: [Jobs]
      servers:
        - url: /
      summary: Queue a new attempt on the same retryable TaskRun
      operationId: retryTaskRunV2
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/TaskRunId'}
        - {$ref: '#/components/parameters/TaskCommandIdempotencyKey'}
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRunV2Response'}
        '404': {$ref: '#/components/responses/TaskRunV2Error'}
        '409': {$ref: '#/components/responses/TaskRunV2Error'}
  /api/v2/projects/{projectId}/task-runs/{taskRunId}/cancel:
    post:
      tags: [Jobs]
      servers:
        - url: /
      summary: Idempotently request TaskRun cancellation
      operationId: cancelTaskRunV2
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/TaskRunId'}
      responses:
        '200':
          description: Current TaskRun state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRunV2Response'}
        '404': {$ref: '#/components/responses/TaskRunV2Error'}
components:
  securitySchemes:
    platformAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Phase 3 access JWT. The development X-User-Id adapter is profile-bound
        and is deliberately excluded from the public contract.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: integer, format: int64}
    TaskRunId:
      name: taskRunId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema: {type: integer, format: int64}
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: integer, format: int64}
    VersionId:
      name: versionId
      in: path
      required: true
      schema: {type: integer, format: int64}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: integer, format: int64}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-generated retry key. After trimming, 1-100 ASCII characters
        from A-Z, a-z, 0-9, period, underscore, colon, and hyphen are allowed.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]+$'
    TaskCommandIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required command replay key scoped to owner, project, method and normalized path.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: integer, format: int64}
    FieldId:
      name: fieldId
      in: path
      required: true
      schema: {type: integer, format: int64}
  responses:
    TaskRunV2Error:
      description: Public v2 safe error envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TaskRunV2ErrorResponse'}
    StandardError:
      description: Standard API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
  schemas:
    TaskRunV2ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId, taskRunId, details]
          properties:
            code: {type: string}
            message: {type: string}
            correlationId: {type: string, maxLength: 128}
            taskRunId: {type: [string, 'null'], maxLength: 64}
            details:
              type: array
              items:
                type: object
                required: [field, reason, resourceType, resourceId]
                properties:
                  field: {type: [string, 'null']}
                  reason: {type: string}
                  resourceType: {type: [string, 'null']}
                  resourceId: {type: [string, 'null']}
    TaskRunV2Response:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/TaskRunPublicViewV2'}
        meta:
          type: object
          required: [correlationId]
          properties:
            correlationId: {type: string, maxLength: 128}
    TaskRunPublicViewV2:
      type: object
      required: [id, taskType, subject, state, retryable, cancelable, correlationId, createdAt]
      properties:
        id: {type: string, maxLength: 64}
        taskType: {type: string}
        subject:
          type: object
          required: [type, id]
          properties:
            type: {type: string, maxLength: 80}
            id: {type: string, maxLength: 64}
        state:
          type: string
          enum: [QUEUED, READY, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
        retryable: {type: boolean}
        cancelable: {type: boolean}
        correlationId: {type: string, maxLength: 128}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        errorSummary:
          type: [object, 'null']
          properties:
            code: {type: string}
        resultResource:
          type: [object, 'null']
          properties:
            type: {type: string}
            id: {type: string}
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ApiError:
      type: object
      required: [code, message, fieldErrors, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
        retryable: {type: boolean}
    ErrorApiResponse:
      type: object
      required: [success, error, meta]
      properties:
        success: {type: boolean, const: false}
        error: {$ref: '#/components/schemas/ApiError'}
        meta: {$ref: '#/components/schemas/Meta'}
    SignupRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password:
          type: string
          format: password
          minLength: 8
          description: Maximum 72 UTF-8 bytes; never persisted or logged raw.
        displayName: {type: string, minLength: 1, maxLength: 50}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Raw token is accepted only at this boundary and stored as SHA-256.
    User:
      type: object
      required: [id, email, displayName, role, status]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {type: string, enum: [USER, ADMIN]}
        status:
          type: string
          enum: [PENDING, ACTIVE, LOCKED, SUSPENDED, WITHDRAWN]
    TokenPair:
      type: object
      required:
        [tokenType, accessToken, accessTokenExpiresIn, refreshToken,
         refreshTokenExpiresIn]
      properties:
        tokenType: {type: string, const: Bearer}
        accessToken: {type: string}
        accessTokenExpiresIn: {type: integer, format: int64, minimum: 1}
        refreshToken: {type: string}
        refreshTokenExpiresIn: {type: integer, format: int64, minimum: 1}
    Auth:
      type: object
      required: [user, tokens]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tokens: {$ref: '#/components/schemas/TokenPair'}
    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        description:
          type: [string, 'null']
          maxLength: 10000
        industryCategory:
          type: [string, 'null']
          maxLength: 100
    ProjectStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    ProjectStage:
      type: string
      enum:
        - DOCUMENT
        - STRUCTURING
        - LEGAL_REVIEW
        - FEASIBILITY
        - FINANCIAL
        - PERSONA_CONFIGURATION
        - PANEL_SURVEY
        - PANEL_DISCUSSION
        - REPORT
        - MARKETING
        - COMPLETED
    ProjectSummary:
      type: object
      required: [id, title, stage, status, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        industryCategory: {type: [string, 'null']}
        stage: {$ref: '#/components/schemas/ProjectStage'}
        status: {$ref: '#/components/schemas/ProjectStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [ownerId, version]
          properties:
            ownerId: {type: integer, format: int64}
            description: {type: [string, 'null']}
            startedAt: {type: [string, 'null'], format: date-time}
            completedAt: {type: [string, 'null'], format: date-time}
            version: {type: integer, format: int64, minimum: 0}
    DocumentUpload:
      type: object
      required: [projectId, documentId, versionId, jobId, status]
      properties:
        projectId: {type: integer, format: int64}
        documentId: {type: integer, format: int64}
        versionId: {type: integer, format: int64}
        jobId: {type: integer, format: int64}
        status:
          $ref: '#/components/schemas/JobStatus'
          description: QUEUED for a newly accepted upload; current job status for an idempotent replay.
    DocumentSummary:
      type: object
      required: [documentId, documentType, currentVersion, status, latestVersionId, updatedAt]
      properties:
        documentId: {type: integer, format: int64}
        documentType: {type: string, enum: [BUSINESS_PLAN]}
        currentVersion: {type: integer}
        status: {type: string, enum: [ACTIVE, REPLACED, DELETED]}
        latestVersionId: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
    DocumentVersion:
      type: object
      required: [documentId, versionId, versionNumber, originalFileName, sizeBytes, parseStatus, uploadedAt]
      properties:
        documentId: {type: integer, format: int64}
        versionId: {type: integer, format: int64}
        versionNumber: {type: integer}
        originalFileName: {type: string}
        sizeBytes: {type: integer, format: int64}
        parseStatus: {$ref: '#/components/schemas/JobStatus'}
        uploadedAt: {type: string, format: date-time}
    JobStatus:
      type: string
      enum:
        - NOT_STARTED
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - PARTIAL
        - FAILED
        - CANCELED
    Job:
      type: object
      required:
        [jobId, projectId, jobType, status, progress, attempt,
         sourceDocumentVersionId]
      properties:
        jobId: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        jobType: {type: string}
        status: {$ref: '#/components/schemas/JobStatus'}
        progress: {type: integer, minimum: 0, maximum: 100}
        message: {type: string}
        attempt: {type: integer, minimum: 0}
        nextAttemptAt: {type: string, format: date-time}
        retryable: {type: boolean}
        sourceDocumentVersionId:
          type: [integer, 'null']
          format: int64
          description: Source version for DOCUMENT_PARSE; null for unrelated job types.
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    MissingField:
      type: object
      required:
        [fieldId, fieldCode, sectionCode, label, required, status, priority,
         version]
      properties:
        fieldId: {type: integer, format: int64}
        fieldCode: {type: string}
        sectionCode: {$ref: '#/components/schemas/BusinessPlanSectionCode'}
        label: {type: string}
        required: {type: boolean}
        status: {type: string, enum: [OPEN, FILLED, WAIVED]}
        reason: {type: string}
        priority: {type: string, enum: [HIGH, MEDIUM, LOW]}
        userValue: {type: string}
        version:
          type: integer
          format: int64
          minimum: 0
          description: >
            Optimistic lock version of this missing field. It is distinct from
            StructuredPlan.versionNumber and is mapped to lockVersion in the frontend.
    BusinessPlanSectionCode:
      type: string
      description: >
        Stable canonical code for the default BUSINESS_PLAN catalog. The order
        shown here is the required display and persistence order.
      enum:
        - BUSINESS_OVERVIEW
        - MARKET_SIZE
        - TARGET_CUSTOMER
        - COMPETITIVE_ANALYSIS
        - PRODUCT_SERVICE
        - BUSINESS_MODEL
        - COST_PROFITABILITY
        - SALES_GOALS_FINANCIAL_PROJECTIONS
        - TECHNOLOGY_PRODUCTION
        - LEGAL_PERMITS
        - SCHEDULE_RISK
        - EVIDENCE_LIST
    StructuredItemStatus:
      type: string
      description: >
        Domain extraction status. Only PRESENT contributes to completion.
        PASS/REJECT are frontend view-model labels, not persisted statuses.
      enum: [PRESENT, MISSING, PARTIAL, INVALID, UNKNOWN]
    StructuredPlanSection:
      type: object
      required:
        [sectionCode, displayName, sequence, status, evidence, sourceBlockReferences]
      properties:
        sectionCode: {$ref: '#/components/schemas/BusinessPlanSectionCode'}
        displayName: {type: string}
        sequence: {type: integer, minimum: 1, maximum: 12}
        status: {$ref: '#/components/schemas/StructuredItemStatus'}
        extractedContent: {type: string}
        reason: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: array
          items: {type: string}
        sourceBlockReferences:
          type: array
          items: {type: integer, minimum: 1}
    StructuredPlan:
      type: object
      required:
        [planId, projectId, sourceDocumentVersionId, versionNumber, status,
         completionRate, version, sections, missingFields, createdAt, parserVersion,
         promptVersion, modelName, provider]
      properties:
        planId: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        sourceDocumentVersionId: {type: integer, format: int64}
        versionNumber: {type: integer}
        status: {type: string, enum: [DRAFT, NEEDS_INPUT, CONFIRMED]}
        completionRate: {type: integer, minimum: 0, maximum: 100}
        version:
          type: integer
          format: int64
          minimum: 0
          description: >
            Optimistic lock version of this structured plan. It is distinct from
            StructuredPlan.versionNumber and is mapped to lockVersion in the frontend.
        confirmedAt: {type: string, format: date-time}
        confirmedBy:
          type: integer
          format: int64
          description: Safe user identifier for the confirming user.
        sections:
          type: array
          minItems: 12
          maxItems: 12
          items: {$ref: '#/components/schemas/StructuredPlanSection'}
        missingFields:
          type: array
          items: {$ref: '#/components/schemas/MissingField'}
        createdAt: {type: string, format: date-time}
        parserVersion: {type: string}
        promptVersion: {type: string}
        modelName: {type: string}
        provider:
          type: string
          description: >
            AI provider identifier. The value mock means the result was
            generated by the deterministic local/test adapter, not a real AI provider.
    UpdateMissingFieldRequest:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [FILLED, WAIVED]}
        value: {type: string, minLength: 1, maxLength: 4000}
        reason: {type: string, minLength: 1, maxLength: 500}
        version:
          type: integer
          format: int64
          minimum: 0
          description: Current missing-field lockVersion observed by the client.
      description: >
        FILLED requires value. WAIVED requires reason. OPEN transitions are not
        supported in Phase 3.
    ConfirmStructuredPlanRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: >
            Current structured-plan lockVersion observed by the client; never
            send the source document plan versionNumber here.
