      properties:
        id: {type: integer, format: int64}
        personaCode: {type: string}
        clusterId: {type: string}
        displayName: {type: string}
        shortName: {type: string}
        description: {type: string}
        ageGroup: {type: string}
        gender: {type: string}
        sampleSize: {type: [integer, 'null'], minimum: 0}
        weightedShare: {type: [number, 'null'], minimum: 0, maximum: 1}
        dataSource: {type: string, const: 2025 한국미디어패널조사}
        dataVersion: {type: string, const: p25v32}
        catalogVersion: {type: string, const: persona-catalog-v1}
        keyTraitsJson: {type: string}
        demographicSummaryJson: {type: string}
        evidenceMetricsJson: {type: string}
        limitationsJson: {type: string}
