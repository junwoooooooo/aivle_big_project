      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        dimensionCode: {$ref: '#/components/schemas/FeasibilityDimensionCode'}
        title: {type: string}
        description: {type: string}
        reason: {type: string}
        priority: {type: string, enum: [HIGH, MEDIUM, LOW]}
        validationMethod: {type: string}
        expectedEvidence: {type: string}
        status: {type: string, enum: [OPEN, COMPLETED, DISMISSED]}
        displayOrder: {type: integer, minimum: 1}
    BaselinePersona:
