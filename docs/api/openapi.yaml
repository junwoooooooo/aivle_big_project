openapi: 3.1.0
info:
  title: New Pipeline API
  version: 1.0.0-r7a
  description: Public foundation API and the new six-stage project pipeline.
servers:
  - url: /
tags:
  - name: Foundation
  - name: Pipeline
paths:
  /api/v1/auth/signup:
    post: {tags: [Foundation], summary: Register user, responses: {'201': {description: Created}}}
  /api/v1/auth/login:
    post: {tags: [Foundation], summary: Login, responses: {'200': {description: Authenticated}}}
  /api/v1/projects:
    get: {tags: [Foundation], summary: List owned projects, responses: {'200': {description: Projects}}}
    post: {tags: [Foundation], summary: Create project, responses: {'201': {description: Created}}}
  /api/v1/projects/{projectId}:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {tags: [Foundation], summary: Get project, responses: {'200': {description: Project}}}
    patch: {tags: [Foundation], summary: Update project metadata, responses: {'200': {description: Updated}}}
    delete: {tags: [Foundation], summary: Delete project, responses: {'204': {description: Deleted}}}
  /api/v3/projects/{projectId}/modules:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {tags: [Pipeline], summary: Get new-pipeline module status, responses: {'200': {description: Module states}}}
  /api/v3/projects/{projectId}/idea-brief:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {tags: [Pipeline], summary: Get Idea Brief, responses: {'200': {description: Idea Brief}}}
  /api/v3/projects/{projectId}/idea-brief/derive:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post: {tags: [Pipeline], summary: Start Idea Brief derivation, responses: {'200': {description: Task accepted}}}
  /api/v3/projects/{projectId}/idea-brief/confirm:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post: {tags: [Pipeline], summary: Confirm Idea Brief snapshot, responses: {'200': {description: Confirmed}}}
  /api/v3/projects/{projectId}/concept-factory-runs:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post: {tags: [Pipeline], summary: Start Concept Factory, responses: {'200': {description: Run started}}}
  /api/v3/projects/{projectId}/concept-selections:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post: {tags: [Pipeline], summary: Select concept, responses: {'200': {description: Selection created}}}
  /api/v3/projects/{projectId}/module-handoffs:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post: {tags: [Pipeline], summary: Create immutable external-module handoff, responses: {'200': {description: Handoff created}}}
  /api/v3/projects/{projectId}/planning/current:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {tags: [Pipeline], summary: Get current planning state, responses: {'200': {description: Planning}}}
  /api/v3/projects/{projectId}/planning/finalize:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post: {tags: [Pipeline], summary: Finalize planning snapshot, responses: {'200': {description: Finalized}}}
  /api/v3/projects/{projectId}/marketing-contents:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {tags: [Pipeline], summary: List marketing contents, responses: {'200': {description: Contents}}}
    post: {tags: [Pipeline], summary: Generate marketing content, responses: {'200': {description: Content task created}}}
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: integer, format: int64}
