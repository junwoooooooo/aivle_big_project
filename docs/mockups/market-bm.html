<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시장분석 · BM 분석 — UI 목업 (미용실 노쇼 관리)</title>
<!--
  UI 사양 목업 — **실제 서비스 톤을 그대로 쓴다.**

  토큰·컴포넌트는 저장소에서 그대로 옮겼다. 여기서 새 색·새 여백을 만들지 않는다:
    frontEnd/src/shared/styles/tokens.css     민트 강조 · 중성 녹색 · 상태 5색 · 여백/반경
    frontEnd/src/shared/ui/ui.css             .ui-card · .ui-badge · .ui-alert · .ui-button
    frontEnd/src/app/layouts/layouts.css      .app-shell(#fafbfb) · .app-topbar · .app-main
    frontEnd/src/app/project-shell/…css       .pipeline-shell 헤더 · 좌측 네비 · 상태 칩
    frontEnd/src/app/module-status/…Model.js  8단계 라벨 · 상태 라벨

  데이터: docs/mockups/build.py 가 주입한다.
    시장조사 ai/tests/fixtures/market_research/full.json  ← 골든 픽스처
    BM 판정  ai/tests/fixtures/market_research/bm.json    ← 골든 픽스처
    BM 9칸   docs/mockups/bm_canvas_projected.json        ← 배선 복구 후 예상치
-->
<style>
/* ─── tokens.css 에서 그대로 ──────────────────────────────── */
:root{
  color-scheme:light;
  --color-mint-50:#ecfbf7; --color-mint-500:#22b89a; --color-mint-700:#116f5f;
  --color-neutral-50:#f7f9f8; --color-neutral-100:#edf1ef; --color-neutral-300:#cbd5d1;
  --color-neutral-600:#5d6c66; --color-neutral-800:#26312d; --color-white:#fff;

  --color-bg-default:var(--color-white); --color-bg-subtle:var(--color-neutral-50);
  --color-surface:var(--color-white);
  --color-text-primary:var(--color-neutral-800); --color-text-secondary:var(--color-neutral-600);
  --color-border-default:var(--color-neutral-300); --color-border-strong:#93a49e;
  --color-action-primary:var(--color-mint-500); --color-action-primary-hover:var(--color-mint-700);
  --color-status-success:#2e7d4f; --color-status-warning:#b7791f;
  --color-status-danger:#c23b3b;  --color-status-info:#316bcb; --color-status-neutral:#5d6c66;

  --font-family-sans:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;
  --font-size-caption:.75rem; --font-size-small:.875rem; --font-size-body:1rem;
  --font-size-h4:1.25rem; --font-size-h3:1.5rem;
  --line-height-body:1.625; --line-height-heading:1.35;
  --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;

  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem;
  --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem;
  --radius-control:.5rem; --radius-card:.75rem; --radius-panel:1rem; --radius-pill:999px;
  --border-width:1px; --shadow-raised:0 8px 24px rgb(38 49 45 / 10%);
  --motion-fast:220ms; --ease-standard:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
body{
  margin:0; background:#fafbfb; color:#17363a;
  font-family:var(--font-family-sans); font-size:var(--font-size-body);
  line-height:var(--line-height-body); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; line-height:var(--line-height-heading); letter-spacing:-.02em}
p{margin:0} ul,ol{margin:0; padding:0; list-style:none}
a{color:var(--color-action-primary-hover); text-decoration:none}
a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}

/* ─── layouts.css — 앱 껍데기 ─────────────────────────────── */
.app-topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:1.4rem;
  min-height:3.75rem; padding:0 clamp(1rem,4vw,3.25rem);
  border-bottom:1px solid #e1e8e7; background:rgb(255 255 255 / .92); backdrop-filter:blur(12px);
}
.app-brand{display:inline-flex; align-items:center; gap:.55rem; color:#17363a;
  font-size:.9rem; font-weight:800; letter-spacing:-.02em}
.app-brand span{display:grid; place-items:center; width:1.55rem; height:1.55rem;
  border-radius:.4rem; background:#0f8878; color:#fff; font-size:.75rem}
.app-topbar__spacer{margin-left:auto; display:flex; align-items:center; gap:.6rem}
.app-project-search{min-width:14rem; min-height:2.25rem; padding:.45rem .7rem;
  border:1px solid #d7e2e0; border-radius:.45rem; background:#fff; color:#8fa3a0; font-size:.82rem}
.profile-avatar{display:inline-grid; place-items:center; width:2rem; height:2rem;
  border-radius:50%; background:#dff3ee; color:#087465; font-size:.78rem; font-weight:800}
.app-main{width:min(100% - 2rem,78rem); margin:0 auto; padding:clamp(1.5rem,4vw,3.25rem) 0}

/* ─── project-shell.css — 파이프라인 셸 ───────────────────── */
.pipeline-shell{display:grid; gap:1.75rem; width:100%}
.pipeline-shell__header{display:grid; grid-template-columns:minmax(0,1fr) minmax(14rem,.8fr) auto;
  gap:1.5rem; align-items:end; padding-bottom:1.1rem; border-bottom:1px solid var(--color-border-default)}
.pipeline-shell__project p,.pipeline-shell__module span,.pipeline-page-heading p{
  margin:0; color:var(--color-text-secondary); font-size:.75rem; font-weight:700}
.pipeline-shell__project h1{margin:.2rem 0 0; font-size:clamp(1.5rem,2.5vw,1.75rem); letter-spacing:-.035em}
.pipeline-shell__module{display:flex; align-items:end; justify-content:space-between; gap:.75rem}
.pipeline-shell__module h2{margin:.2rem 0 0; font-size:clamp(1.125rem,2vw,1.25rem)}
.pipeline-shell__actions{display:flex; gap:.45rem}
.pipeline-shell__actions a{display:inline-flex; align-items:center; min-height:2.75rem;
  padding:.55rem .7rem; border:1px solid var(--color-border-default); border-radius:var(--radius-control);
  color:var(--color-text-primary); font-size:.78rem; font-weight:750}
.pipeline-status{display:inline-flex; align-items:center; min-height:1.6rem; padding:.2rem .5rem;
  border-radius:999px; background:#edf1f1; color:#51676a; font-size:.7rem; font-weight:800; white-space:nowrap}
.pipeline-status[data-tone="info"]{background:#e5f4f8; color:#176275}
.pipeline-status[data-tone="warning"]{background:#fff3d2; color:#78570c}
.pipeline-status[data-tone="success"]{background:#e2f5eb; color:#19613d}
.pipeline-status[data-tone="danger"]{background:#fde8e6; color:#8b3028}

.pipeline-shell__body{display:grid; grid-template-columns:15rem minmax(0,1fr);
  gap:clamp(1.25rem,3vw,2.5rem); align-items:start}
.pipeline-shell__sidebar{position:sticky; top:calc(3.75rem + 1rem); padding:.7rem;
  border:1px solid var(--color-border-default); border-radius:var(--radius-card); background:var(--color-surface)}
.pipeline-shell__sidebar ul{display:grid; gap:.2rem}
.pipeline-shell__sidebar button{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.5rem;
  align-items:center; width:100%; min-height:2.9rem; padding:.55rem .6rem; border:0; border-radius:.5rem;
  background:transparent; color:var(--color-text-secondary); font:inherit; font-size:.78rem;
  line-height:1.35; text-align:left; cursor:pointer}
.pipeline-shell__sidebar button:hover{background:var(--color-neutral-50)}
.pipeline-shell__sidebar button[aria-current="page"]{background:#e8f6f2; color:var(--color-mint-700); font-weight:800}
.pipeline-shell__sidebar small{padding:.15rem .35rem; border-radius:999px; background:#edf1f1;
  color:#51676a; font-size:.62rem; font-weight:800; white-space:nowrap}
.pipeline-shell__sidebar small[data-tone="success"]{background:#e2f5eb; color:#19613d}
.pipeline-shell__sidebar small[data-tone="info"]{background:#e5f4f8; color:#176275}
.pipeline-shell__sidebar small[data-tone="warning"]{background:#fff3d2; color:#78570c}

.pipeline-shell__main{display:grid; min-width:0; gap:1.75rem}
/* 층 간격은 여기가 정한다 — 형제에게 margin 을 걸면 접히거나 겹친다. */
.view{display:grid; align-content:start; gap:1.75rem}
.view > .pipeline-page-heading{margin-bottom:-.5rem}   /* 머리글은 바로 아래와 한 덩이 */
.pipeline-page-heading{display:grid; gap:.4rem}
.pipeline-page-heading h2{margin:0; font-size:1.35rem}
.pipeline-page-heading > span{color:var(--color-text-secondary); font-size:.82rem; line-height:1.7}
.view[hidden]{display:none}

/* ─── ui.css — 공용 컴포넌트 ──────────────────────────────── */
.ui-card{padding:var(--space-6); border:var(--border-width) solid var(--color-border-default);
  border-radius:var(--radius-card); background:var(--color-surface)}
.ui-card__title{margin:0 0 var(--space-3); font-size:var(--font-size-h4); color:var(--color-text-primary)}
.ui-badge{display:inline-flex; align-items:center; justify-content:center; width:max-content;
  min-height:1.75rem; padding:0 var(--space-3); border-radius:var(--radius-pill);
  font-size:var(--font-size-small); font-weight:var(--font-weight-semibold);
  white-space:nowrap; line-height:1.2}
.ui-badge--neutral{color:var(--color-status-neutral); background:var(--color-neutral-100)}
.ui-badge--success{color:var(--color-status-success); background:rgb(46 125 79 / 10%)}
.ui-badge--warning{color:var(--color-status-warning); background:rgb(183 121 31 / 12%)}
.ui-badge--danger{color:var(--color-status-danger); background:rgb(194 59 59 / 10%)}
.ui-badge--info{color:var(--color-status-info); background:rgb(49 107 203 / 10%)}
.ui-alert{display:grid; gap:var(--space-1); padding:var(--space-4);
  border:var(--border-width) solid var(--color-border-default); border-inline-start-width:4px;
  border-radius:var(--radius-control); background:var(--color-surface); font-size:var(--font-size-small)}
.ui-alert--info{border-inline-start-color:var(--color-status-info)}
.ui-alert--warning{border-inline-start-color:var(--color-status-warning)}
.ui-alert--danger{border-inline-start-color:var(--color-status-danger)}
.ui-alert strong{font-weight:var(--font-weight-semibold)}
.ui-button{display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:2.75rem; padding:0 var(--space-4); border:var(--border-width) solid transparent;
  border-radius:var(--radius-control); font:inherit; font-weight:var(--font-weight-semibold);
  cursor:pointer; transition:background-color var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast)}
.ui-button--primary{background:var(--color-action-primary); color:var(--color-neutral-800)}
.ui-button--primary:hover{background:var(--color-action-primary-hover); color:#fff}
.ui-button--outline{border-color:var(--color-border-default); background:var(--color-surface);
  color:var(--color-text-primary)}
.ui-button--small{min-height:2.5rem; padding-inline:var(--space-3); font-size:var(--font-size-small)}
.ui-accordion{border-block:var(--border-width) solid var(--color-border-default); background:var(--color-surface)}
.ui-accordion summary{min-height:2.75rem; padding:var(--space-3) var(--space-4);
  font-weight:var(--font-weight-semibold); font-size:var(--font-size-small); cursor:pointer;
  list-style:none; display:flex; align-items:center; gap:var(--space-2)}
.ui-accordion summary::-webkit-details-marker{display:none}
.ui-accordion summary::before{content:"▸"; color:var(--color-border-strong); font-size:.7rem}
.ui-accordion[open] summary::before{content:"▾"}
.ui-accordion summary .n{margin-left:auto; color:var(--color-text-secondary);
  font-weight:var(--font-weight-medium); font-size:var(--font-size-caption)}
.ui-accordion > div{padding:0 var(--space-4) var(--space-4)}

/* ─── 시장분석 · BM 분석 화면 ─────────────────────────────── */
.mk-kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1rem}
@media(max-width:840px){.mk-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mk-kpi{display:grid; gap:.4rem; align-content:start; padding:1.35rem 1.25rem;
  border:1px solid var(--color-border-default); border-radius:var(--radius-card);
  background:var(--color-surface); font:inherit; text-align:left; cursor:pointer;
  transition:border-color var(--motion-fast),background-color var(--motion-fast)}
.mk-kpi:hover{border-color:var(--color-action-primary); background:var(--color-mint-50)}
.mk-kpi > span:first-child{color:var(--color-text-secondary); font-size:.75rem; font-weight:700}
.mk-kpi b{font-size:1.5rem; font-weight:800; letter-spacing:-.03em; line-height:1.25}
.mk-kpi small{color:var(--color-text-secondary); font-size:.75rem}
.mk-kpi .ui-badge{margin-top:.5rem}

.mk-limits{display:grid; gap:.65rem; padding:1.25rem 1.35rem; border:1px solid var(--color-border-default);
  border-radius:var(--radius-card); background:var(--color-bg-subtle)}
.mk-limits > span{color:var(--color-text-secondary); font-size:.72rem; font-weight:800; letter-spacing:.02em}
.mk-limits ul{display:grid; gap:.5rem}
.mk-limits li{position:relative; padding-left:1rem; color:var(--color-text-primary);
  font-size:.84rem; line-height:1.75}
.mk-limits li::before{content:""; position:absolute; left:0; top:.68rem; width:5px; height:5px;
  border-radius:50%; background:var(--color-status-warning)}

.mk-sec{border:1px solid var(--color-border-default); border-radius:var(--radius-card);
  background:var(--color-surface); scroll-margin-top:5.5rem}
.mk-sec.is-on{border-color:var(--color-action-primary); box-shadow:0 0 0 3px var(--color-mint-50)}
.mk-sec__h{display:flex; align-items:center; gap:.7rem; padding:1.25rem 1.5rem}
.mk-sec__n{display:grid; place-items:center; width:1.4rem; height:1.4rem; border-radius:.35rem;
  background:var(--color-neutral-100); color:var(--color-text-secondary); font-size:.68rem; font-weight:800}
.mk-sec__h h3{font-size:1rem}
.mk-sec__h > span:last-child{margin-left:auto; color:var(--color-text-secondary);
  font-size:.78rem; line-height:1.6; text-align:right}
.mk-sec__b{padding:1.5rem; border-top:1px solid var(--color-neutral-100)}

.mk-figs{display:flex; flex-wrap:wrap; gap:2.5rem; margin-bottom:1.35rem}
.mk-figs > div > span{display:block; margin-bottom:.2rem; color:var(--color-text-secondary);
  font-size:.72rem; font-weight:700}
.mk-figs b{font-size:1.35rem; font-weight:800; letter-spacing:-.02em; line-height:1.3}
.mk-figs small{display:block; margin-top:.15rem; color:var(--color-text-secondary); font-size:.76rem}

table{width:100%; border-collapse:collapse}
th,td{padding:.95rem 0; font-size:.87rem; line-height:1.65; text-align:left; vertical-align:top}
thead th{padding-bottom:.6rem; border-bottom:1px solid var(--color-border-default);
  color:var(--color-text-secondary); font-size:.7rem; font-weight:800; letter-spacing:.02em}
tbody tr{border-top:1px solid var(--color-neutral-100)}
tbody tr:first-child{border-top:0}
td.v{padding-right:1.35rem; font-weight:700; white-space:nowrap}
td.p{padding-right:1.1rem; color:var(--color-text-secondary); font-size:.79rem; white-space:nowrap}
td.s{text-align:right; white-space:nowrap}
td.s a::after{content:" ↗"; font-size:.65rem; color:var(--color-text-secondary)}

/* 경계 — 값과 함께 옮겨야 하는 문장. 절대 접지 않는다. */
.mk-caveat{margin-top:.5rem; color:var(--color-status-warning);
  font-size:.8rem; font-style:italic; line-height:1.7}
.mk-quote{margin-top:.4rem; color:var(--color-text-secondary); font-size:.82rem; line-height:1.7}
.mk-note{margin-top:1.25rem; padding:.95rem 1.1rem; border-radius:var(--radius-control);
  background:var(--color-bg-subtle); color:var(--color-text-primary); font-size:.82rem; line-height:1.75}
.mk-note strong{font-weight:800}

.mk-comps{display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.9rem}
.mk-comp{padding:1.15rem 1.2rem; border:1px solid var(--color-border-default); border-radius:var(--radius-control)}
.mk-comp h4{margin-bottom:.85rem; font-size:.9rem}
.mk-comp div{display:flex; align-items:baseline; gap:.6rem; font-size:.82rem;
  line-height:1.7; margin-bottom:.5rem}
.mk-comp div > span:first-child{flex:1; color:var(--color-text-secondary)}
.mk-comp b{font-weight:700}
.mk-comp .none{color:var(--color-text-secondary); font-weight:400}
.mk-comp__src{margin-top:.9rem; padding-top:.75rem; border-top:1px solid var(--color-neutral-100); font-size:.78rem}

.mk-grp{margin-bottom:1.35rem}
.mk-grp:last-child{margin-bottom:0}
.mk-grp h4{margin-bottom:.6rem; color:var(--color-text-primary); font-size:.8rem; font-weight:700}
.mk-grp ul{display:grid; gap:.4rem}
.mk-grp li{position:relative; padding-left:.9rem; color:var(--color-text-secondary);
  font-size:.8rem; line-height:1.75}
.mk-grp li::before{content:"–"; position:absolute; left:0}

/* BM 캔버스 */
.bm-tally{display:flex; flex-wrap:wrap; gap:.75rem; color:var(--color-text-secondary); font-size:.78rem}
.bm-tally span{display:inline-flex; align-items:center; gap:.4rem}
.bm-tally b{color:var(--color-text-primary); font-weight:800}
.bm-kind{padding:.15rem .45rem; border-radius:999px; font-size:.65rem; font-weight:800}
.bm-kind--obs{background:#e5f4f8; color:#176275}
.bm-kind--plan{background:#edf1f1; color:#51676a}

/* 9칸을 «의미»로 세 묶음. 5열 포스터 배치는 웹 폭에서 칸당 195px 밖에 안 나와
   한글이 10~12자마다 끊긴다. 4·3·2 로 나누면 칸당 280px 이상 나오고, 행 병합이
   사라져 짧은 칸 옆의 빈 구멍도 없어진다. 묶음 순서 = 누구에게 · 어떻게 만들고 · 돈은. */
.bm-band{display:grid; gap:.75rem; margin-bottom:1.75rem}
.bm-band:last-of-type{margin-bottom:0}
.bm-band__t{display:flex; align-items:center; gap:.6rem; color:var(--color-text-secondary);
  font-size:.72rem; font-weight:800; letter-spacing:.06em}
.bm-band__t::after{content:""; flex:1; height:1px; background:var(--color-neutral-100)}
.bm-band__row{display:grid; gap:1rem; align-items:start}
.bm-band--4 .bm-band__row{grid-template-columns:repeat(4,minmax(0,1fr))}
.bm-band--3 .bm-band__row{grid-template-columns:repeat(3,minmax(0,1fr))}
.bm-band--2 .bm-band__row{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1000px){.bm-band__row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:620px){.bm-band__row{grid-template-columns:1fr!important}}

.bm-cell{display:flex; flex-direction:column; gap:.85rem; padding:1.25rem 1.35rem 1.15rem;
  border:1px solid var(--color-border-default); border-radius:var(--radius-card);
  background:var(--color-surface); font:inherit; text-align:left; cursor:pointer;
  transition:border-color var(--motion-fast),background-color var(--motion-fast)}
.bm-cell:hover{border-color:var(--color-action-primary); background:var(--color-mint-50)}
.bm-cell--plan{background:var(--color-bg-subtle)}
.bm-cell__h{display:flex; align-items:center; gap:.45rem}
.bm-cell__h h4{color:var(--color-text-primary); font-size:.84rem; font-weight:700}
.bm-dot{margin-left:auto; flex:none; width:.45rem; height:.45rem; border-radius:50%}
.bm-dot--ok{background:var(--color-status-success)}
.bm-dot--mid{background:var(--color-status-warning)}
.bm-dot--off{background:var(--color-border-strong)}
.bm-dot--none{background:var(--color-neutral-300)}
/* 줄 수를 자르지 않는다 — 3줄 클램프가 «주 채…» 처럼 말을 끊어 오히려 답답했다. */
.bm-cell__lead{color:var(--color-text-primary); font-size:.86rem; line-height:1.75}
.bm-cell__none{color:var(--color-text-secondary); font-size:.82rem; line-height:1.75}
/* 구분선을 없앤다. 바닥에 고정된 줄이 짧은 카드 안에 빈 공간을 만들고 있었다. */
.bm-cell__foot{display:flex; align-items:center; gap:.45rem;
  color:var(--color-text-secondary); font-size:.73rem}

.bm-swr{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; align-items:start}
@media(max-width:800px){.bm-swr{grid-template-columns:1fr}}
.bm-swr > div{padding:1.35rem 1.35rem 1.5rem; border:1px solid var(--color-border-default);
  border-radius:var(--radius-card); background:var(--color-surface)}
.bm-swr h4{margin-bottom:.85rem; font-size:.72rem; font-weight:800; letter-spacing:.02em}
.bm-swr li{position:relative; margin-bottom:.6rem; padding-left:.9rem;
  color:var(--color-text-primary); font-size:.84rem; line-height:1.75}

  :'출처 없음';

function normalize(raw){
  const evidence=L(raw.evidence).map(e=>({...e,caveats:L(e.caveats),
    materialIds:L(e.materialIds),assumptions:L(e.assumptions)}));
  const canvas=raw.canvas?.cells?LAYOUT.map(([key,area,label])=>{
    const f=raw.canvas.cells.find(c=>c?.canvasCell===key);
    return{key,area,label,status:f?.status??'UNVERIFIED',content:L(f?.content),
      reason:f?.reason??'사유가 오지 않았다',evidenceIds:L(f?.marketEvidenceIds),
      missing:L(f?.missingEvidence),caveats:L(f?.caveats),absent:!f}}):null;
  return{runId:raw.runId,conceptId:raw.conceptId,asOf:raw.asOf,mode:raw.mode,
    stages:L(raw.stages),degradations:L(raw.degradations),scorecard:L(raw.scorecard),
    market:raw.market,bm:raw.bm,canvas,evidence,byId:new Map(evidence.map(e=>[e.id,e]))};
}

/* ═══ 시장분석 — 성적표 7과목이 곧 목차 ═══════════════════ */
function renderMarket(r){
  const m=r.market??{};
  const score=Object.fromEntries(r.scorecard.map(s=>[s.subject,s]));
  const pick=ids=>L(ids).map(i=>r.byId.get(i)).filter(Boolean);

  /* 근거를 과목으로 가른다. ⚠ 봉투에 과목 필드가 없어서 하는 임시 분류다. */
  const sizeIds=new Set([...L(m.tam?.evidenceIds),...L(m.sam?.evidenceIds)]);
  const growIds=new Set(L(m.growth?.evidenceIds));
  const priceIds=new Set(L(m.price?.evidenceIds));
  const obs=r.evidence.filter(e=>e.kind!=='계산');
  const calc=r.evidence.filter(e=>e.kind==='계산');
  const bag={size:[],grow:[],comp:[],price:[],demand:[]};
  for(const e of obs){
    if(COMP_METRICS.includes(e.metric)) bag.comp.push(e);
    else if(priceIds.has(e.id)) bag.price.push(e);
    else if(sizeIds.has(e.id)) bag.size.push(e);
    else if(growIds.has(e.id)) bag.grow.push(e);
    else bag.demand.push(e);
  }

  const tile=(label,fig,to,sub)=>{if(!fig)return'';
    const short=fig.unit==='KRW'?krw(fig.value):null;
    return `<button type="button" class="mk-kpi" data-jump="sec-${to}">
      <span>${label}</span>
      <b class="num">${esc(short??fmt(fig.value,fig.unit))}</b>
      <small class="num">${esc(sub??(short?fmt(fig.value,fig.unit):''))}</small>
      ${grade(fig.grade)}</button>`};
  const p=m.price;
  const kpis=`<div class="mk-kpis">
    ${tile('TAM',m.tam,'CALCULATION')}${tile('SAM',m.sam,'CALCULATION')}
    ${tile('연 성장률',m.growth,'GROWTH','2023 → 2024')}
    ${p?`<button type="button" class="mk-kpi" data-jump="sec-PRICE"><span>가격대 (월)</span>
      <b class="num">${esc(krw(p.min))}~${esc(krw(p.max))}</b>
      <small class="num">${esc(fmt(p.min,p.currency))} ~ ${esc(fmt(p.max,p.currency))}</small>
      ${grade(p.grade)}</button>`:''}</div>`;

  /* 값을 오독하게 만드는 문장만. 규칙상 지울 수 없다. */
  const limits=[];
  if(L(m.tam?.assumptions).length) limits.push(`TAM·SAM 은 가정이 곱해진 추정이다 — ${m.tam.assumptions.join(' · ')}`);
  if(p?.baseNote) limits.push(p.baseNote);
  if(!m.som) limits.push('SOM 은 산출하지 않았다 — 0 이 아니라 «안 쟀다»다.');
  if(L(m.growth?.assumptions).length) limits.push(m.growth.assumptions.at(-1));

  const sec=(n,title,subject,body)=>{
    const s=score[subject];
    return `<section class="mk-sec" id="sec-${subject}"><div class="mk-sec__h">
      <span class="mk-sec__n">${n}</span><h3>${title}</h3>
      ${s?badge(STATE,s.state):''}
      <span>${esc(s?.detail??'')}</span></div>
      <div class="mk-sec__b">${body}</div></section>`;
  };
  const rows=(list,opt={})=>`<table>
    <thead><tr><th>값</th><th>항목</th><th>기간</th><th>등급</th><th>출처</th></tr></thead>
    <tbody>${list.map(e=>`<tr>
      <td class="v num">${esc(fmt(e.value,e.unit))}</td>
      <td>${esc(e.subject)} · ${esc(e.metric)}
        ${opt.quote&&e.quote?`<div class="mk-quote">“${esc(e.quote)}”</div>`:''}
        ${e.caveats.map(c=>`<div class="mk-caveat">${esc(c)}</div>`).join('')}</td>
      <td class="p num">${esc(e.period??'—')}</td>
      <td>${grade(e.grade)}</td>
      <td class="s">${link(e)}<div class="p" style="text-align:right">${esc(SRC[e.sourceKind]??'')}</div></td>
    </tr>`).join('')}</tbody></table>`;

  // 큰 숫자 줄을 빼고 표만 둔다 — 둘이 **같은 두 값**을 그대로 반복하고 있었다.
  const sizeBody=bag.size.length?rows(bag.size)
    :'<p class="bm-cell__none">모집단 관측이 없다.</p>';

  const g=m.growth;
  const growBody=g?`<div class="mk-figs"><div><span>연 성장률</span>
      <b class="num">${esc(fmt(g.value,g.unit))}</b><small>${esc(g.formula??'')}</small></div></div>
    ${bag.grow.length?rows(bag.grow):''}
    <div class="mk-note">${esc(g.assumptions.join(' · '))}</div>`
    :'<p class="bm-cell__none">성장률을 산출하지 않았다.</p>';

  /* 경쟁사 — 회사별. 못 찾은 슬롯도 같은 카드에 세운다. */
  const gaps=[];
  for(const b of L(m.notFound)){
    if(b.item!=='empty_slots'&&b.item!=='thin_slots')continue;
    for(const line of String(b.detail??'').split('\n')){
      const mm=line.match(/^\S+\s+—\s+([^·]+)·\s*([^(]+)\(/);
      if(mm&&COMP_METRICS.includes(mm[2].trim())) gaps.push([mm[1].trim(),mm[2].trim()]);
    }
  }
  const names=[...new Set([...bag.comp.map(e=>e.subject),...gaps.map(x=>x[0])])];
  const compBody=names.length?`
    <div class="mk-comps">${names.map(name=>{
      const mine=bag.comp.filter(e=>e.subject===name);
      const miss=gaps.filter(x=>x[0]===name).map(x=>x[1]).filter(k=>!mine.some(e=>e.metric===k));
      return `<div class="mk-comp"><h4>${esc(name)}</h4>
        ${mine.map(e=>`<div><span>${esc(e.metric)}</span><b class="num">${esc(fmt(e.value,e.unit))}</b></div>`).join('')}
        ${miss.map(k=>`<div><span>${esc(k)}</span><span class="none">못 찾음</span></div>`).join('')}
        ${mine.length?`<div class="mk-comp__src">${link(mine[0])}</div>`:''}
        ${mine.flatMap(e=>e.caveats).map(c=>`<div class="mk-caveat">${esc(c)}</div>`).join('')}</div>`;
    }).join('')}</div>
    <div class="mk-note">수집 대상은 가입 매장 수·매출액·요금 같은 숫자다. <strong>기능·차별점 비교는 조사 항목에 없다.</strong></div>`
    :'<p class="bm-cell__none">경쟁사 관측이 없다.</p>';

  const cited=pick(p?.evidenceIds);
  const hosts=new Set(cited.map(e=>host(e.sourceUrl)).filter(Boolean));
  const priceBody=p?`<div class="mk-figs">
      <div><span>최저</span><b class="num">${esc(fmt(p.min,p.currency))}</b></div>
      <div><span>대표값 (잠정)</span><b class="num">${esc(fmt(p.base,p.currency))}</b></div>
      <div><span>최고</span><b class="num">${esc(fmt(p.max,p.currency))}</b></div></div>
    ${rows(cited)}
    ${(hosts.size===1&&cited.length>1)?`<div class="ui-alert ui-alert--warning" style="margin-top:.85rem">
      ${cited.length}건이지만 출처 도메인은 <strong>${esc([...hosts][0])} 하나</strong>다 —
      ${cited.length}중 확인이 아니라 <strong>1중 확인</strong>이다.</div>`:''}`
    :'<p class="bm-cell__none">표시가격 관측이 없다.</p>';

  const demandBody=bag.demand.length?rows(bag.demand,{quote:true})
    :'<p class="bm-cell__none">수요를 뒷받침하는 관측이 없다.</p>';

  const calcBody=(calc.length?calc.map(c=>{
    const inputs=Object.entries(c.inputs??{});
    return `<div class="mk-figs"><div><span>${esc(c.metric)}</span>
        <b class="num">${esc(fmt(c.value,c.unit))}</b><small>${esc(c.formula??'')}</small></div></div>
      <table><tbody>${inputs.map(([k,v],i)=>{
        const backed=i<c.materialIds.length;
        return `<tr><td class="v num">${esc(v.toLocaleString('ko-KR'))}</td><td>${esc(k)}</td>
          <td class="s">${backed
            ?`<span class="ui-badge ui-badge--success">${esc(c.materialIds[i])}</span>`
            :'<span class="ui-badge ui-badge--warning">뒷받침 근거 없음</span>'}</td></tr>`}).join('')}</tbody></table>
      <div class="mk-note">${c.assumptions.map(a=>esc(a)).join('<br>')}</div>`}).join('')
    :'<p class="bm-cell__none">계산 카드가 없다.</p>');

  const nf=L(m.notFound);
  const nfTotal=nf.reduce((s,b)=>s+String(b.detail??'').split('\n').filter(Boolean).length,0);
  const secs=parseInt(r.stages.reduce((s,x)=>s+(x.seconds??0),0));

  return `
    <div class="pipeline-page-heading">
      <p>4. 시장분석·기획 확정</p>
      <h2>시장조사 결과</h2>
      <span>${esc(r.conceptId??'컨셉 미상')} · 기준일 ${esc(r.asOf??'미기재')} · run ${esc(r.runId??'—')}</span>
    </div>
    ${kpis}
    ${limits.length?`<div class="mk-limits"><span>이 숫자를 읽는 조건</span>
      <ul>${limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}

    ${sec(1,'시장 크기','MARKET_SIZE',sizeBody)}
    ${sec(2,'성장률','GROWTH',growBody)}
    ${sec(3,'경쟁사','COMPETITOR',compBody)}
    ${sec(4,'가격','PRICE',priceBody)}
    ${sec(5,'수요 근거','DEMAND',demandBody)}
    ${sec(6,'시장 규모 계산','CALCULATION',calcBody)}

    <details class="ui-accordion"><summary>7. 못 찾은 것<span class="n">${nfTotal}건</span></summary>
      <div>${nf.map(b=>`<div class="mk-grp"><h4>${esc(NF_LABEL[b.item]??b.item)}</h4>
        <ul>${String(b.detail??'').split('\n').filter(Boolean)
          .map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ul></div>`).join('')}</div></details>
    <details class="ui-accordion"><summary>실행 기록<span class="n">${r.stages.length}단계 · ${secs}초${
      r.degradations.length?` · 건너뜀 ${r.degradations.length}`:''}</span></summary>
      <div><table><tbody>${r.stages.map(s=>`<tr><td>${esc(s.name)}</td>
        <td class="p">${esc(s.status)}</td><td class="s p">${s.seconds??'—'}초</td></tr>`).join('')}</tbody></table>
        ${r.degradations.length?`<div class="mk-grp" style="margin-top:.8rem"><h4>건너뛴 단계</h4><ul>${
          r.degradations.map(d=>`<li>${esc(d.stage)} — ${esc(d.detail)}</li>`).join('')}</ul></div>`:''}
      </div></details>

    <div class="mk-actions">
      <button type="button" class="ui-button ui-button--primary" data-goto="businessModel">
        다음 — BM 분석</button></div>`;
}

/* ═══ BM 분석 ═════════════════════════════════════════════ */
function renderBm(r){
  const b=r.bm;
  const kindOf=c=>CELL_KIND[c.key]??['관측',''];
  const empty=c=>kindOf(c)[0]==='계획'
    ? '컨셉 서술에 이 칸 내용이 없다'      // 조사 실패가 아니다 — 입력이 없는 것이다
    : '조사에서 근거를 못 찾았다';
  /** 계획 칸에 「계획」 상태를 또 쓰면 같은 말이 두 번 나온다. 요건이 다르니 말도 다르게. */
  const statusOf=c=>kindOf(c)[0]==='계획'
    ? (c.content.length?'서술됨':'서술 없음')
    : (CELL_LABEL[c.status]??c.status);

  const byKey=new Map((r.canvas??[]).map(c=>[c.key,c]));
  const cell=c=>{
    const [kind]=kindOf(c);
    return `<button type="button" class="bm-cell${c.content.length?'':' bm-cell--plan'}"
        data-cell="${esc(c.key)}">
      <span class="bm-cell__h"><h4>${esc(c.label)}</h4>
        <span class="bm-dot bm-dot--${CELL_TONE[c.status]??'none'}"></span></span>
      ${c.content.length?`<span class="bm-cell__lead">${esc(c.content[0])}</span>`
        :`<span class="bm-cell__none">${esc(empty(c))}</span>`}
      <span class="bm-cell__foot"><span class="bm-kind bm-kind--${kind==='관측'?'obs':'plan'}">${kind}</span>
        ${esc(statusOf(c))}${c.evidenceIds.length?` · 근거 ${c.evidenceIds.length}`:''}</span>
    </button>`};
  const bands=BANDS.map(([title,list])=>`
    <div class="bm-band bm-band--${list.length}">
      <div class="bm-band__t">${title}</div>
      <div class="bm-band__row">${list.map(([key])=>{
        const c=byKey.get(key); return c?cell(c):''}).join('')}</div>
    </div>`).join('');

  /* 「3칸만 찼다」로 읽히지 않게, 두 종류를 따로 센다. */
  const obsC=(r.canvas??[]).filter(c=>kindOf(c)[0]==='관측');
  const planC=(r.canvas??[]).filter(c=>kindOf(c)[0]==='계획');
  const tally=`<p class="bm-tally">
    <span><b class="bm-kind bm-kind--obs">관측</b> ${obsC.length}칸 중
      <b>${obsC.filter(c=>c.evidenceIds.length).length}칸</b> 근거 확보</span>
    <span><b class="bm-kind bm-kind--plan">계획</b> ${planC.length}칸 중
      <b>${planC.filter(c=>c.content.length).length}칸</b> 서술됨 — 이 칸들은 조사 대상이 아니다</span></p>`;

  const details=(r.canvas??[]).map(c=>{
    const [kind,origin]=kindOf(c);
    const cited=c.evidenceIds.map(i=>r.byId.get(i)).filter(Boolean);
    return `<section class="bm-det" id="bm-${esc(c.key)}">
      <div class="bm-det__h"><span class="bm-dot bm-dot--${CELL_TONE[c.status]??'none'}"></span>
        <h4>${esc(c.label)}</h4>
        <span class="bm-kind bm-kind--${kind==='관측'?'obs':'plan'}">${kind}</span>
        <span class="bm-det__o">${esc(origin)}</span>
        ${badge({x:[CELL_TONE[c.status]==='ok'?'success':CELL_TONE[c.status]==='mid'?'warning':'neutral',
                    statusOf(c)]},'x')}</div>
      <div class="bm-det__b">
        ${c.absent?`<p class="bm-cell__none">이 칸이 결과에 오지 않았다 — 「미확인」과 다른 사건이다.</p>`:''}
        ${c.content.length?`<ul class="bm-det__c">${c.content.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`
          :`<p class="bm-cell__none">${esc(empty(c))}</p>`}
        <p class="bm-det__r">${esc(c.reason)}</p>
        ${c.caveats.map(x=>`<p class="mk-caveat">${esc(x)}</p>`).join('')}
        ${cited.length?`<table style="margin-top:.6rem"><tbody>${cited.map(e=>`<tr>
          <td class="v num">${esc(fmt(e.value,e.unit))}</td>
          <td>${esc(e.subject)} · ${esc(e.metric)}</td>
          <td class="p num">${esc(e.period??'—')}</td>
          <td>${grade(e.grade)}</td>
          <td class="s">${link(e)}</td></tr>`).join('')}</tbody></table>`:''}
        ${c.missing.length?`<p class="bm-det__m"><b>못 찾은 것</b>${esc(c.missing.join(' · '))}</p>`:''}
      </div></section>`}).join('');

  const box=(t,items,col)=>`<div><h4 style="color:${col}">${t}</h4><ul>${
    items.length?items.map(x=>`<li>${esc(x)}</li>`).join('')
                :'<li style="color:var(--color-text-secondary)">없음</li>'}</ul></div>`;

  return `
    <div class="pipeline-page-heading">
      <p>5. BM 분석</p>
      <h2>비즈니스 모델 캔버스</h2>
      <span>${esc(r.conceptId??'컨셉 미상')} · 기준일 ${esc(r.asOf??'미기재')} · run ${esc(r.runId??'—')}</span>
    </div>

    ${b?`<div class="ui-card" style="display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; padding:1.1rem 1.25rem">
      <h3 style="font-size:.95rem">판정</h3>
      ${badge(DECISION,b.decision)}
      <span class="ui-badge ui-badge--neutral">${esc(CONF[b.confidence]??b.confidence??'')}</span>
      <p style="flex:1 1 16rem; color:var(--color-text-secondary); font-size:.85rem">${
        esc(b.consistencySummary??b.marketFitSummary??b.summary??'')}</p></div>`:''}
    ${tally}
    <div>${bands}</div>
    ${b?`<div class="bm-swr">${box('강점',L(b.strengths),'var(--color-status-success)')}
      ${box('약점',L(b.weaknesses),'var(--color-status-warning)')}
      ${box('위험',L(b.risks),'var(--color-status-danger)')}</div>`:''}

    <h3 style="font-size:1rem; margin-top:.75rem">칸별 세부</h3>
    <div class="bm-dets">${details}</div>`;
}

/* ═══ 배선 ════════════════════════════════════════════════ */
const RAW=JSON.parse(document.getElementById('fixture-data').textContent);
const MARKET=normalize(RAW.full), BM=normalize(RAW.bm);
document.getElementById('view-market').innerHTML=renderMarket(MARKET);
document.getElementById('view-bm').innerHTML=renderBm(BM);

document.getElementById('steps').innerHTML=STEPS.map(([id,label,status,tone])=>
  `<li><button type="button" data-step="${id}"${id==='market'?' aria-current="page"':''}>
    <span>${label}</span><small${tone?` data-tone="${tone}"`:''}>${status}</small></button></li>`).join('');

function show(step){
  const isBm = step==='businessModel';
  for(const el of document.querySelectorAll('[data-step]'))
    el.toggleAttribute('aria-current', el.dataset.step===step);
  for(const el of document.querySelectorAll('[data-step][aria-current]'))
    el.setAttribute('aria-current','page');
  document.getElementById('view-market').hidden = isBm;
  document.getElementById('view-bm').hidden = !isBm;
  document.getElementById('module-title').textContent =
    isBm ? '5. BM 분석' : '4. 시장분석·기획 확정';
  window.scrollTo({top:0});
}

/**
 * 요약 → 세부로 착지.
 *
 * ⚠ 두 가지가 이 한 줄을 망가뜨렸다. 둘 다 **조용히** 실패한다:
 *   1. 카드가 `<button>` 이라 클릭이 포커스를 만든다. 브라우저는 포커스 받은 요소를 화면
 *      안으로 되돌리는데, 그게 우리 스크롤보다 나중에 일어나 **되감긴다.**
 *      → 포커스를 떼고 다음 프레임에 움직인다.
 *   2. 그 «다음 프레임»을 `requestAnimationFrame` 으로 잡으면 **숨은 탭에서 영영 안 온다**
 *      (실측: `document.hidden` 일 때 rAF 콜백 0회). 그러면 착지가 통째로 사라진다.
 *      → `setTimeout(…, 0)` 은 순서는 같고 가시성에 매이지 않는다.
 */
function jump(id){
  const el=document.getElementById(id); if(!el)return;
  for(const x of document.querySelectorAll('.is-on'))x.classList.remove('is-on');
  el.classList.add('is-on');
  document.activeElement?.blur?.();
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),0);
}

document.addEventListener('click',e=>{
  const s=e.target.closest('[data-step]');
  if(s) return ['market','businessModel'].includes(s.dataset.step) ? show(s.dataset.step) : null;
  const g=e.target.closest('[data-goto]'); if(g)return show(g.dataset.goto);
  const c=e.target.closest('[data-cell]'); if(c)return jump(`bm-${c.dataset.cell}`);
  const k=e.target.closest('[data-jump]'); if(k)return jump(k.dataset.jump);
});
</script>
